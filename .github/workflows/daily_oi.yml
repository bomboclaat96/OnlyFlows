name: Daily Open Interest Fetcher

on:
  schedule:
    # Läuft jeden Tag um 22:00 UTC (nach US-Börsenschluss)
    - cron: '0 22 * * *'
  workflow_dispatch: # Erlaubt dir, es auch jederzeit manuell per Klick zu starten

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v3

      - name: Python einrichten
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Abhängigkeiten installieren
        run: |
          pip install yfinance pandas requests

      - name: Skript ausführen
        run: |
          python fetch_oi.py

      - name: Änderungen (CSV) automatisch committen & pushen
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "bot@github.com"
          git add data/
          git commit -m "Auto-update Open Interest data via Action" || echo "Keine Änderungen"
          git push
