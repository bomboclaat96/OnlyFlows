name: Daily Open Interest Fetcher

on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions:
  contents: write  # <--- DAS IST DER SCHLÜSSEL: Erlaubt der Action, ins Repo zu pushen

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4  # Auf v4 aktualisiert

      - name: Python einrichten
        uses: actions/setup-python@v5  # Auf v5 aktualisiert
        with:
          python-version: '3.10'

      - name: Abhängigkeiten installieren
        run: |
          pip install yfinance pandas requests

      - name: Skript ausführen
        run: |
          python fetch_oi.py

      - name: Änderungen (CSV) automatisch committen & pushen
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "bot@github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git add data/
          git commit -m "Auto-update Open Interest data via Action" || echo "Keine Änderungen"
          git push
